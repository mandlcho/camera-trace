[package]
name = "art-projector"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "0.21", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "Event",
  "File",
  "FileList",
  "HtmlInputElement",
  "HtmlVideoElement",
  "InputEvent",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Navigator",
  "PointerEvent",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Window",
]

[profile.release]
lto = true
opt-level = "s"
strip = true
